name: Keep the database awake

# Free Supabase projects pause after about a week without visitors, which stops every online feature.
# This calls the game's public API once a day so the project stays active. Since version 58 the server's own clock
# (pg_cron, docs/backend-v16.sql) runs the backups, reminders, cleanup, planned events and the weekly report, so this
# job only keeps the project awake. It only uses the public (publishable) key that is in index.html.
on:
  schedule:
    - cron: "17 15 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      URL: https://nmmlemtljjvfurlrvuvm.supabase.co/rest/v1/rpc
      KEY: sb_publishable_STHuGWpHxg6efQhuvc_sQQ_xO5AvI5J
    steps:
      - name: Ping the game database
        run: |
          set -e
          for i in 1 2 3; do
            if curl -fsS "$URL/kf_live" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}' | head -c 300; then echo; exit 0; fi
            echo "Try $i failed, waiting…"; sleep 20
          done
          exit 1
