name: Keep the database awake

# Free Supabase projects pause after about a week without visitors, which stops every online feature.
# This calls the game's public API every 2 days, which keeps the project active and makes the
# weekly automatic backup when it is due. It only uses the public (publishable) key that is in index.html.
on:
  schedule:
    - cron: "17 5 */2 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      URL: https://nmmlemtljjvfurlrvuvm.supabase.co/rest/v1/rpc
      KEY: sb_publishable_STHuGWpHxg6efQhuvc_sQQ_xO5AvI5J
    steps:
      - name: Ping the game database and make the weekly backup if it is due
        run: |
          set -e
          for i in 1 2 3; do
            if curl -fsS "$URL/kf_backup_tick" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'; then echo; break; fi
            echo "Try $i failed, waiting…"; sleep 20
          done
          curl -fsS "$URL/kf_live" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}' | head -c 300; echo
