<script>
/* V39: Gerät erkennen, bevor die Seite gezeichnet wird. */
(function(){
  var de=document.documentElement,mm=function(q){try{return matchMedia(q).matches}catch(e){return false}};
  function detect(){
    var w=innerWidth,h=innerHeight,sh=Math.min(w,h),ua=navigator.userAgent||'',tp=navigator.maxTouchPoints||0;
    var coarse=mm('(pointer: coarse)'),hover=mm('(hover: hover)');
    var touch=coarse||(!hover&&tp>0);
    var ipad=/iPad/.test(ua)||(navigator.platform==='MacIntel'&&tp>1);
    var phoneUA=!ipad&&/iPhone|iPod|Android.+Mobile|Windows Phone/.test(ua);
    var auto=touch?((phoneUA||sh<600)?'phone':'tablet'):(w<600?'phone':w<1000?'tablet':'desktop');
    var pick=null;try{pick=localStorage.getItem('keksfabrik-device');}catch(e){}
    var dev=(pick==='phone'||pick==='tablet'||pick==='desktop')?pick:auto;
    var o=w>h?'landscape':'portrait',inp=touch?'touch':'mouse';
    if(de.dataset.device!==dev) de.dataset.device=dev;
    if(de.dataset.orient!==o) de.dataset.orient=o;
    if(de.dataset.input!==inp) de.dataset.input=inp;
    return {device:dev,auto:auto,pick:pick||'auto',orient:o,input:inp};
  }
  window.__kfDevice=detect;detect();
  var t=0;addEventListener('resize',function(){clearTimeout(t);t=setTimeout(function(){detect();if(window.__kfDeviceChanged) window.__kfDeviceChanged();},120);});
})();
</script>
